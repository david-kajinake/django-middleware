<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Django Middleware</title>
</head>
<body>
    <h1>

        Hello 
        {% if request.user.name %}
            {{request.user.name}}
         {% elif request.user.username%}
            {{request.user.username}}
        {% endif %}
    </h1>
    <h1>
        This is a HomePage for Django-Middleware's project's templates
    </h1>
    <form action="{% url 'user_logout' %}" method="POST">
        {%csrf_token%}
        <button>Logout</button>
    </form>
</body>
</html>
